
services:
  postgres:
    image: postgres:15
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
        - default   
  minio:
    image: minio/minio:latest
    container_name: mlflow-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT}/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default
    
  create-bucket:
    image: minio/mc:latest
    networks:
      - default
    container_name: mlflow-create-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set myminio "http://${MINIO_HOST}:${MINIO_PORT}" \
          "${MINIO_ROOT_USER}" "${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "myminio/${MINIO_BUCKET:-mlflow}"
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    
    container_name: mlflow-server
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      # Auth Config
      # MLFLOW_AUTH_CONFIG_PATH: /etc/mlflow/auth_config.ini
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_FLASK_SERVER_SECRET_KEY}
      # PLACEHOLDER_PASSWORD: ${PLACEHOLDER_PASSWORD}
      # PLACEHOLDER_USERNAME: ${PLACEHOLDER_USERNAME}

      # Backend store URI built from vars
      MLFLOW_BACKEND_STORE_URI: ${MLFLOW_BACKEND_STORE_URI}

      # S3/MinIO settings
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      MLFLOW_ARTIFACTS_DESTINATION: ${MLFLOW_ARTIFACTS_DESTINATION}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      MLFLOW_S3_IGNORE_TLS: "true"
      MLFLOW_SERVER_ALLOWED_HOSTS: "*.hmbcentral.live,localhost,127.0.0.1"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "*.hmbcentral.live,localhost,127.0.0.1"
      MLFLOW_DOMAIN: ${MLFLOW_DOMAIN}
      # MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME}
      # MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD}
      # Server host/port
      MLFLOW_HOST: ${MLFLOW_HOST}
      MLFLOW_PORT: ${MLFLOW_PORT}

    command:
      - /bin/bash
      - -c
      - |
        pip install --no-cache-dir psycopg2-binary boto3
        mlflow server \
          --backend-store-uri "${MLFLOW_BACKEND_STORE_URI}" \
          --artifacts-destination "${MLFLOW_ARTIFACTS_DESTINATION}" \
          --serve-artifacts \
          --host "${MLFLOW_HOST}" \
          --port "${MLFLOW_PORT}"
    #   
    # command:
    #   - /bin/bash -c mlflow server --app-name basic-auth

    networks:
      - default
      - nginx_proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.mlflow.rule=Host(`${MLFLOW_DOMAIN}`)
      - traefik.http.routers.mlflow.entrypoints=websecure
      - traefik.http.routers.mlflow.tls=true
      - traefik.http.routers.mlflow.tls.certresolver=letsencrypt
      - traefik.http.services.mlflow.loadbalancer.server.port=${MLFLOW_PORT}
      - "traefik.http.middlewares.mlflow.headers.STSSeconds=315360000"
      - "traefik.http.middlewares.mlflow.headers.SSLRedirect=true"
      - "traefik.http.middlewares.mlflow.headers.browserXSSFilter=true"
      - "traefik.http.middlewares.mlflow.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.mlflow.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.mlflow.headers.SSLHost=hmbcentral.live"
      - "traefik.http.middlewares.mlflow.headers.STSIncludeSubdomains=true"
      - "traefik.http.middlewares.mlflow.headers.STSPreload=true"
      # - "traefik.http.routers.mlflow.middlewares=default-chain@file"
    volumes:
        - ./auth_config.ini:/tmp/auth_config.ini:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:${MLFLOW_PORT}/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

networks:
  default:
    name: mlflow-network
  nginx_proxy:
    external: true

volumes:
  pgdata:
  minio-data:
