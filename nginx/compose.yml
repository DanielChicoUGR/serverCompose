services:
  nginx-static:
    image: nginx:alpine
    container_name: nginx_static
    restart: unless-stopped
    
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
    
    networks:
      - nginx_proxy
    
    labels:
      - "traefik.enable=true"
      
      # Sitio estático ejemplo
      - "traefik.http.routers.static-site.rule=Host(`www.hmbcentral.live`)"
      - "traefik.http.routers.static-site.entrypoints=websecure"
      - "traefik.http.routers.static-site.tls.certresolver=letsencrypt"
      - "traefik.http.routers.static-site.middlewares=default-chain"
      - "traefik.http.services.static-site.loadbalancer.server.port=80"


networks:
  nginx_proxy:
    driver: bridge
    external: true
