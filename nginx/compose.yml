services:
    nginx-static:
        image: nginx:alpine
        container_name: nginx_static
        restart: unless-stopped

        volumes:
            - ./webs:/usr/share/nginx/html:ro
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - ./conf.d:/etc/nginx/conf.d:ro

        networks:
            - nginx_proxy

        labels:
            - "traefik.enable=true"

            # PErsonal Web
            - "traefik.http.routers.dachival-website.rule=Host(`dachival.hmbcentral.live`)"
            - "traefik.http.routers.dachival-website.entrypoints=websecure"
            - "traefik.http.routers.dachival-website.tls.certresolver=letsencrypt"
            - "traefik.http.routers.dachival-website.middlewares=default-chain@file"
            - "traefik.http.services.dachival-website.loadbalancer.server.port=80"
            # - "traefik.http.services.dachival-website.service=dachival-website"

networks:
    nginx_proxy:
        driver: bridge
        external: true
