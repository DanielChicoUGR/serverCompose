server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dachival.hmbcentral.live;
    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/dachival.hmbcentral.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dachival.hmbcentral.live/privkey.pem;
    # Static files configuration
    root /var/www/danielPersonalBlog;
    index index.html;
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # Rate limiting - zone: general
        limit_req zone=general burst=20 nodelay;
        try_files $uri $uri/ =404;
    }


    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
