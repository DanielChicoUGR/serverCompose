# Croc service TCP streams (puertos 9009-9013)
upstream croc_9009 {
    server croc:9009;
}

server {
    listen 9009;
    proxy_pass croc_9009;
    proxy_timeout 30s;
    proxy_connect_timeout 5s;
}

upstream croc_9010 {
    server croc:9010;
}

server {
    listen 9010;
    proxy_pass croc_9010;
    proxy_timeout 30s;
    proxy_connect_timeout 5s;
}

upstream croc_9011 {
    server croc:9011;
}

server {
    listen 9011;
    proxy_pass croc_9011;
    proxy_timeout 30s;
    proxy_connect_timeout 5s;
}

upstream croc_9012 {
    server croc:9012;
}

server {
    listen 9012;
    proxy_pass croc_9012;
    proxy_timeout 30s;
    proxy_connect_timeout 5s;
}

upstream croc_9013 {
    server croc:9013;
}

server {
    listen 9013;
    proxy_pass croc_9013;
    proxy_timeout 30s;
    proxy_connect_timeout 5s;
}

