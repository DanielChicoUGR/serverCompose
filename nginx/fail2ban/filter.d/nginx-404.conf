# ==============================================================================
# Filtro Fail2Ban para Errores 404 en Nginx
# ==============================================================================
# Este filtro detecta múltiples errores 404 que pueden indicar escaneo de
# directorios o intentos de encontrar vulnerabilidades.
#
# Ignora rutas comunes y legítimas:
#   - robots.txt
#   - favicon.ico
#   - .well-known (Let's Encrypt)
#
# Uso:
#   Se usa automáticamente con el jail [nginx-404]
# ==============================================================================

[Definition]

# Expresión regular para detectar errores 404
failregex = ^<HOST> -.*"(GET|POST|HEAD).*HTTP.*" 404

# Ignorar rutas legítimas que comúnmente generan 404
ignoreregex = .*(robots\.txt|favicon\.ico|\.well-known).*
