# ==============================================================================
# Filtro Fail2Ban para Abuso de Login en Nginx
# ==============================================================================
# Este filtro detecta intentos repetidos de acceso a endpoints de login.
# Útil para proteger aplicaciones web contra ataques de fuerza bruta.
#
# Rutas detectadas:
#   - /web/login (Odoo)
#   - /login (genérico)
#   - /auth (genérico)
#   - /signin (genérico)
#   - /api/login (APIs)
#
# Uso:
#   Se usa automáticamente con el jail [nginx-login-abuse]
# ==============================================================================

[Definition]

# Expresión regular para detectar POSTs a endpoints de login
failregex = ^<HOST> -.*POST.*/web/login.*HTTP.*
^<HOST> -.*POST.*/login.*HTTP.*
^<HOST> -.*POST.*/auth.*HTTP.*
^<HOST> -.*POST.*/signin.*HTTP.*
^<HOST> -.*POST.*/api/login.*HTTP.*

# Ignorar líneas que no son relevantes
ignoreregex =
