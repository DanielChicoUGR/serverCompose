# ==============================================================================
# Filtro Fail2Ban para Rate Limiting de Nginx
# ==============================================================================
# Este filtro detecta mensajes de rate limiting en los logs de error de Nginx.
# Se activa cuando las zonas de limit_req_zone o limit_conn_zone rechazan
# solicitudes por exceso de tráfico.
#
# Mensajes detectados:
#   - "limiting requests, excess: ... by zone ... client: <IP>"
#   - "limiting connections by zone ... client: <IP>"
#
# Uso:
#   Se usa automáticamente con el jail [nginx-req-limit]
# ==============================================================================

[Definition]

# Expresión regular para detectar rate limiting
failregex = limiting requests, excess:.* by zone.*client: <HOST>
limiting connections by zone.*client: <HOST>

# Ignorar líneas que no son relevantes (opcional)
ignoreregex =
