# ==============================================================================
# Filtro Fail2Ban para Errores de Proxy en Nginx
# ==============================================================================
# Este filtro detecta errores en las conexiones upstream cuando Nginx actúa
# como reverse proxy. Puede indicar ataques DDoS o abusos del servicio.
#
# Errores detectados:
#   - Timeouts de upstream
#   - Sin upstreams disponibles
#   - Conexiones cerradas prematuramente
#
# Uso:
#   Se usa automáticamente con el jail [nginx-proxy]
# ==============================================================================

[Definition]

# Expresión regular para detectar errores de proxy/upstream
failregex = upstream timed out.*client: <HOST>
no live upstreams.*client: <HOST>
upstream prematurely closed connection.*client: <HOST>
recv\(\) failed.*client: <HOST>

# Ignorar líneas que no son relevantes
ignoreregex =
