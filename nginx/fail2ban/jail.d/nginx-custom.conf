# ==============================================================================
# Configuración de Jails para Nginx
# ==============================================================================
# Jails personalizados para proteger el servidor Nginx contra:
#   - Rate limiting abuse
#   - Login brute force
#   - Directory scanning (404)
#   - Proxy errors (DDoS)
# ==============================================================================

[DEFAULT]
# Backend para leer logs - usar 'auto' o 'polling' en lugar de systemd
backend = auto

# ==============================================================================
# Jail 1: nginx-req-limit
# ==============================================================================
# Detecta solicitudes que exceden el rate limit configurado en nginx.conf
# Busca mensajes como:
#   "limiting requests, excess: 5.000 by zone "general", client: 192.168.1.100"
# ==============================================================================

[nginx-req-limit]
enabled = true
backend = auto
filter = nginx-req-limit
logpath = /home/dachival/serverCompose/nginx/logs/error.log
maxretry = 20
findtime = 60
bantime = 3600
action = iptables-multiport[name=ReqLimit, port="http,https", protocol=tcp]

# ==============================================================================
# Jail 2: nginx-login-abuse
# ==============================================================================
# Protege endpoints de login contra ataques de fuerza bruta
# Rutas protegidas: /web/login, /login, /auth, /signin, /api/login
# ==============================================================================

[nginx-login-abuse]
enabled = true
backend = auto
filter = nginx-login
logpath = /home/dachival/serverCompose/nginx/logs/access.log
maxretry = 5
findtime = 300
bantime = 7200
action = iptables-multiport[name=LoginAbuse, port="http,https", protocol=tcp]

# ==============================================================================
# Jail 3: nginx-404
# ==============================================================================
# Detecta escaneo de directorios mediante múltiples errores 404
# Ignora rutas legítimas como robots.txt, favicon.ico, .well-known
# ==============================================================================

[nginx-404]
enabled = true
backend = auto
filter = nginx-404
logpath = /home/dachival/serverCompose/nginx/logs/access.log
maxretry = 50
findtime = 600
bantime = 3600
action = iptables-multiport[name=404Scan, port="http,https", protocol=tcp]

# ==============================================================================
# Jail 4: nginx-proxy
# ==============================================================================
# Detecta problemas con upstream (posibles ataques DDoS)
# Busca errores como:
#   - "upstream timed out"
#   - "no live upstreams"
#   - "upstream prematurely closed connection"
# ==============================================================================

[nginx-proxy]
enabled = true
backend = auto
filter = nginx-proxy
logpath = /home/dachival/serverCompose/nginx/logs/error.log
maxretry = 10
findtime = 300
bantime = 1800
action = iptables-multiport[name=ProxyAbuse, port="http,https", protocol=tcp]

# ==============================================================================
# NOTAS
# ==============================================================================
#
# 1. Los 'logpath' apuntan a logs dentro del contenedor Docker de Nginx
#    que están mapeados al host mediante volúmenes.
#
# 2. Tiempos de baneo:
#    - nginx-req-limit: 1 hora (3600s)
#    - nginx-login-abuse: 2 horas (7200s)
#    - nginx-404: 1 hora (3600s)
#    - nginx-proxy: 30 minutos (1800s)
#
# 3. Para ver estado de un jail:
#    sudo fail2ban-client status nginx-req-limit
#
# 4. Para desbanear una IP:
#    sudo fail2ban-client set nginx-req-limit unbanip 192.168.1.100
#
# ==============================================================================
