# ==============================================================================
# Configuración personalizada de Fail2Ban para Nginx
# ==============================================================================
# Este archivo contiene las jails (cárceles) para proteger el servidor Nginx
# contra diversos tipos de ataques y abusos.
#
# Instalación:
#   sudo ./install-fail2ban.sh
#
# Verificación:
#   sudo fail2ban-client status
#   sudo fail2ban-client status nginx-req-limit
# ==============================================================================

# ------------------------------------------------------------------------------
# Jail para Rate Limiting General
# ------------------------------------------------------------------------------
# Protege contra solicitudes excesivas detectando mensajes de "limiting requests"
# en los logs de Nginx cuando se activan las zonas de rate limiting.
[nginx-req-limit]
enabled = true
filter = nginx-req-limit
logpath = /home/daniel/Proyectos/serverCompose/nginx/logs/error.log
maxretry = 20
findtime = 60
bantime = 3600
action = iptables-multiport[name=ReqLimit, port="http,https", protocol=tcp]

# ------------------------------------------------------------------------------
# Jail para Abuso de Login
# ------------------------------------------------------------------------------
# Detecta intentos repetidos de login en rutas comunes de autenticación.
# Útil para proteger endpoints de login de aplicaciones web.
[nginx-login-abuse]
enabled = true
filter = nginx-login
logpath = /home/daniel/Proyectos/serverCompose/nginx/logs/access.log
maxretry = 5
findtime = 300
bantime = 7200
action = iptables-multiport[name=LoginAbuse, port="http,https", protocol=tcp]

# ------------------------------------------------------------------------------
# Jail para Errores 404 (Posible Escaneo)
# ------------------------------------------------------------------------------
# Detecta intentos de escaneo de directorios mediante múltiples errores 404.
# Ignora rutas comunes como robots.txt y favicon.ico.
[nginx-404]
enabled = true
filter = nginx-404
logpath = /home/daniel/Proyectos/serverCompose/nginx/logs/access.log
maxretry = 50
findtime = 600
bantime = 3600
action = iptables-multiport[name=404Scan, port="http,https", protocol=tcp]

# ------------------------------------------------------------------------------
# Jail para Errores de Proxy
# ------------------------------------------------------------------------------
# Detecta problemas con upstream que pueden indicar ataques DDoS o abusos.
# Útil cuando se usa Nginx como reverse proxy.
[nginx-proxy]
enabled = true
filter = nginx-proxy
logpath = /home/daniel/Proyectos/serverCompose/nginx/logs/error.log
maxretry = 10
findtime = 300
bantime = 1800
action = iptables-multiport[name=ProxyAbuse, port="http,https", protocol=tcp]
