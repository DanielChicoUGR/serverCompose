# Psono Server Settings
# IMPORTANT: This file contains SENSITIVE keys. Generate them before running.
# See GEMINI.md for instructions on how to generate these keys.

DEBUG: False

# Database Configuration
DATABASE:
  ENGINE: 'django.db.backends.postgresql_psycopg2'
  NAME: 'psono'
  USER: 'psono'
  PASSWORD: 'change_me_secure_password' # Must match .env
  HOST: 'psono-db'
  PORT: '5432'

# Security Keys (GENERATE THESE!)
SECRET_KEY: 'CHANGE_ME_GENERATE_RANDOM_STRING'
PRIVATE_KEY: |
  -----BEGIN RSA PRIVATE KEY-----
  CHANGE_ME_PASTE_GENERATED_PRIVATE_KEY_HERE
  -----END RSA PRIVATE KEY-----
PUBLIC_KEY: |
  -----BEGIN PUBLIC KEY-----
  CHANGE_ME_PASTE_GENERATED_PUBLIC_KEY_HERE
  -----END PUBLIC KEY-----

# URLs
HOST_URL: 'https://psono.hmbcentral.live'
WEB_CLIENT_URL: 'https://psono.hmbcentral.live'

# Email Configuration (Optional)
EMAIL_BACKEND: 'django.core.mail.backends.smtp.EmailBackend'
EMAIL_HOST: 'smtp.example.com'
EMAIL_PORT: 587
EMAIL_HOST_USER: 'user'
EMAIL_HOST_PASSWORD: 'password'
EMAIL_USE_TLS: True
DEFAULT_FROM_EMAIL: 'psono@example.com'
SERVER_EMAIL: 'psono@example.com'

