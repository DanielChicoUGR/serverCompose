[project]
name = "nginxconfigbuilder"
version = "0.1.0"
description = "CLI tool to generate Nginx configuration files for HTTP/HTTPS and TCP/UDP services"
readme = "README.md"
authors = [{ name = "Daniel Chico", email = "dachival@correo.ugr" }]
requires-python = ">=3.12"
dependencies = ["click>=8.1.7", "rich>=13.7.0"]

[project.scripts]
nginx-config = "nginxconfigbuilder.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
