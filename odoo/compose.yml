services:
  postgres:
    image: postgres:15
    container_name: odoo_postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
      - PASSWORD_FILE=/run/secrets/postgresql_password
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    secrets:
      - postgresql_password
    networks:
      - odoo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:18.0
    container_name: odoo
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - HOST=postgres
      - USER=odoo
      - PASSWORD_FILE=/run/secrets/postgresql_password
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo:ro
      - ./addons:/mnt/extra-addons
    secrets:
      - postgresql_password
      - odoo_admin_password
    networks:
      - odoo_network
      - nginx_proxy
    expose:
      - "8069" # Puerto web
      - "8072" # Puerto longpolling/chat
    restart: unless-stopped
    command: -- --db_host=postgres --db_port=5432 --db_user=odoo --db_password_file=/run/secrets/postgresql_password
secrets:
  postgresql_password:
    file: ./odoo_pg_pass
  odoo_admin_password:
    file: ./odoo_admin_pass
volumes:
  odoo-web-data:
    driver: local
  odoo-db-data:
    driver: local

networks:
  odoo_network:
    driver: bridge
  nginx_proxy:
    external: true
