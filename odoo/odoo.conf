[options]
; Configuración principal de Odoo

; === Database Settings ===
db_host = db
db_port = 5432
db_user = odoo
db_maxconn = 64
db_name = False
db_template = template0

; === Admin Password ===
; La contraseña maestra se cargará desde el archivo de secreto
; admin_passwd se configura via --admin_passwd_file en el comando

; === Server Settings ===
http_port = 8069
longpolling_port = 8072

; === Logging ===
logfile = False
log_level = info
log_handler = :INFO

; === Workers ===
; Ajustar según los recursos disponibles
workers = 2
max_cron_threads = 1

; === Timeouts ===
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

; === Paths ===
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; === Session ===
; Desactivar listado de bases de datos en login
list_db = False

; === Proxy Mode ===
; Habilitar si usas un proxy inverso (nginx, traefik, etc.)
proxy_mode = False

; === Translation ===
; without_demo = True
; load_language = es_ES
