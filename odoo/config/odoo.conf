[options]
# Configuración de base de datos
db_host = postgres
db_port = 5432
db_user = odoo
db_password = False
db_maxconn = 64
db_name = False
db_template = template0

# Configuración de servidor
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
# admin_passwd = $pbkdf2-sha512$600000$...  # Cambiar por hash seguro
http_port = 8069
longpolling_port = 8072

# Configuración de workers (ajustar según recursos)
workers = 2
max_cron_threads = 1

# Límites
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
limit_time_real_cron = -1

# Logging
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = :INFO

# Seguridad
proxy_mode = True
list_db = False
dbfilter = ^%d$

# Seguridad adicional
proxy_mode = True
list_db = False
dbfilter = ^%d$

# Desactivar endpoints sensibles
server_wide_modules = base,web

# CORS (si usas API externa)
; cors = *